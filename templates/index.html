<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rover GIS Command Center</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background-color: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 360px; padding: 15px; display: flex; flex-direction: column; gap: 12px; background: #1e293b; z-index: 1000; overflow-y: auto; }
        #map { flex-grow: 1; height: 100%; }
        .card { background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; }
        #video-canvas { width: 100%; height: 180px; background: #111; border-radius: 6px; border: 1px solid #475569; display: block; }
        .btn-group { display: flex; gap: 8px; margin-top: 10px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; }
        .btn-start { background: #22c55e; }
        .btn-pause { background: #eab308; }
        .btn-stop { background: #ef4444; }
        .stat { font-size: 1.1rem; font-weight: bold; color: #38bdf8; margin-top: 4px; }
    </style>
</head>
<body>

<div id="sidebar">
    <h3 style="margin:0 0 5px 0;">ROVER GIS LIVE TRACKING</h3>
    
    <div class="card">
        <canvas id="video-canvas" width="320" height="180"></canvas>
    </div>

    <div class="card">
        <label style="font-size: 0.85rem; font-weight: bold;">SET TARGET RANGE</label>
        <select id="target-km" onchange="updateConfig()" style="width: 100%; padding: 8px; margin-top: 5px; background: #1e293b; color: white; border: 1px solid #475569; border-radius: 4px;">
            <option value="0.05">0.05 km (50m - Quick Demo)</option>
            <option value="0.5">0.5 km</option>
            <option value="1.0">1.0 km</option>
        </select>
        <div class="btn-group">
            <button class="btn-start" onclick="sendControl('START')">▶ START</button>
            <button class="btn-pause" onclick="sendControl('PAUSE')">⏸ PAUSE</button>
            <button class="btn-stop" onclick="sendControl('STOP')">⏹ STOP</button>
        </div>
    </div>

    <div class="card">
        <div style="font-size: 0.9rem;">STATUS: <span id="rover-status" class="stat">READY</span></div>
        <div style="margin-top: 8px; font-size: 0.9rem;">DISTANCE COVERED: <br><span id="distance-km" class="stat">0 / 0.05 km</span></div>
        <div style="margin-top: 8px; font-size: 0.9rem;">NO. OF HOLES: <br><span id="potholes-count" class="stat">0</span></div>
        <div style="margin-top: 8px; font-size: 0.9rem;">MATERIAL USED: <br><span id="material-kg" class="stat">0 kg</span></div>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([17.3850, 78.4867], 18);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    const roverIcon = L.divIcon({
        className: 'custom-rover',
        html: '<div style="background:#00f0ff; width:18px; height:18px; border-radius:50%; border:3px solid white; box-shadow:0 0 10px #00f0ff;"></div>',
        iconSize: [20, 20]
    });

    let roverMarker = L.marker([17.3850, 78.4867], {icon: roverIcon}).addTo(map);
    let potholeMarkers = [];
    let isPatrolling = false;

    // HUD Canvas Animation
    const canvas = document.getElementById('video-canvas');
    const ctx = canvas.getContext('2d');
    let frameOffset = 0;

    function drawVideoFrame() {
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(100, 180); ctx.lineTo(140, 0);
        ctx.moveTo(220, 180); ctx.lineTo(180, 0);
        ctx.stroke();

        if (isPatrolling) {
            frameOffset = (frameOffset + 4) % 40;
        }

        ctx.strokeStyle = '#eab308';
        ctx.lineWidth = 3;
        ctx.setLineDash([15, 15]);
        ctx.lineDashOffset = -frameOffset;
        ctx.beginPath();
        ctx.moveTo(160, 180); ctx.lineTo(160, 0);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#00f0ff';
        ctx.font = '12px sans-serif';
        ctx.fillText('LIVE CLOUD VISION FEED', 10, 20);

        if (isPatrolling && Math.random() < 0.2) {
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 2;
            ctx.strokeRect(110, 70, 100, 50);
            ctx.fillStyle = '#ef4444';
            ctx.fillText('POTHOLE DETECTED', 110, 65);
        }

        requestAnimationFrame(drawVideoFrame);
    }
    drawVideoFrame();

    // Matching API Calls
    function sendControl(cmd) {
        fetch('/api/control', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({command: cmd})
        });
    }

    function updateConfig() {
        const val = document.getElementById('target-km').value;
        fetch('/api/config', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({target_km: val})
        });
    }

    // Telemetry Polling
    setInterval(() => {
        fetch('/api/telemetry')
            .then(res => res.json())
            .then(data => {
                isPatrolling = (data.rover_status === "PATROL_ACTIVE" || data.rover_status === "RETURNING_TO_BASE");
                
                document.getElementById('rover-status').innerText = data.rover_status;
                document.getElementById('distance-km').innerText = `${data.distance_traveled_km} / ${data.target_km} km`;
                document.getElementById('potholes-count').innerText = data.total_potholes;
                document.getElementById('material-kg').innerText = `${data.total_material_kg} kg`;

                const pos = [data.current_lat, data.current_lng];
                roverMarker.setLatLng(pos);
                map.panTo(pos);

                if (data.detections.length === 0 && potholeMarkers.length > 0) {
                    potholeMarkers.forEach(m => map.removeLayer(m));
                    potholeMarkers = [];
                }

                if (data.detections.length > potholeMarkers.length) {
                    data.detections.slice(potholeMarkers.length).forEach(det => {
                        const m = L.circleMarker([det.lat, det.lng], {
                            color: '#22c55e', radius: 8, fillOpacity: 0.8
                        }).addTo(map);
                        potholeMarkers.push(m);
                    });
                }
            });
    }, 1000);
</script>

</body>
</html>
