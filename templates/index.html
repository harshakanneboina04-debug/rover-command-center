<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rover GIS Command Center</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #fff; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .grid-container { display: grid; grid-template-columns: 280px 1fr 320px; gap: 20px; }
        .card { background: #1e1e1e; border-radius: 8px; padding: 15px; border: 1fr solid #333; }
        .btn { width: 100%; padding: 12px; margin-bottom: 10px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; }
        .btn-start { background-color: #2e7d32; } .btn-start:hover { background-color: #1b5e20; }
        .btn-pause { background-color: #f57f17; } .btn-pause:hover { background-color: #f57f17; }
        .btn-stop { background-color: #c62828; } .btn-stop:hover { background-color: #8e0000; }
        .btn-power { background-color: #424242; } .btn-power:hover { background-color: #212121; }
        #map { height: 500px; width: 100%; border-radius: 8px; }
        .status-box { background: #2a2a2a; padding: 10px; border-radius: 5px; margin-bottom: 15px; border-left: 4px solid #00bcd4; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; }
        .input-group input, .input-group select { width: 100%; padding: 8px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 4px; }
        .warning-text { color: #ffca28; font-size: 13px; font-weight: bold; margin-top: 10px; min-height: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🛰️ ROVER GIS COMMAND CENTER</h2>
        <div id="statusBadge" style="color: #4caf50; font-weight: bold;">STATUS: READY</div>
    </div>

    <div class="grid-container">
        <!-- LEFT: CONTROLS & DISTANCE SELECTION -->
        <div class="card">
            <h3>CONTROLS</h3>
            <br>
            
            <!-- DYNAMIC TARGET DISTANCE INPUT (1 to 10 KM) -->
            <div class="input-group">
                <label for="targetDistance">TARGET DISTANCE (1.0 - 10.0 KM):</label>
                <input 
                    type="number" 
                    id="targetDistance" 
                    min="1.0" 
                    max="10.0" 
                    step="0.5" 
                    value="10.0" 
                    onchange="setTargetDistance(this.value)"
                >
            </div>

            <button class="btn btn-start" onclick="sendCommand('START')">▶ START PATROL</button>
            <button class="btn btn-pause" onclick="sendCommand('PAUSE')">⏸ PAUSE</button>
            <button class="btn btn-stop" onclick="sendCommand('STOP')">⏹ ABORT & RETURN</button>
            <button class="btn btn-power" onclick="sendCommand('POWER_OFF')">⚡ POWER TOGGLE</button>
            
            <hr style="border-color: #333; margin: 15px 0;">
            <button class="btn" style="background:#0288d1;" onclick="clearMap()">📍 CLEAR MAP MARKERS</button>
        </div>

        <!-- CENTER: LIVE GIS MAP -->
        <div class="card">
            <div id="map"></div>
            <div id="warningMsg" class="warning-text">💡 CLICK ANYWHERE ON THE MAP TO SET A CUSTOM STARTING POINT.</div>
        </div>

        <!-- RIGHT: TELEMETRY & LOGS -->
        <div class="card">
            <h3>TELEMETRY DATA</h3>
            <br>
            <div class="status-box">
                <div>DISTANCE TRAVELED: <strong id="distVal">0.0</strong> / <strong id="targetVal">10.0</strong> km</div>
            </div>
            <div class="status-box">
                <div>BATTERY LEVEL: <strong id="batteryVal">100</strong>%</div>
            </div>
            <div class="status-box">
                <div>MATERIAL LEVEL: <strong id="materialVal">100</strong>%</div>
            </div>
            <div class="status-box">
                <div>REPAIRED POTHOLES: <strong id="potholeVal">0</strong> (<span id="matKgVal">0.0</span> kg used)</div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map = L.map('map').setView([17.42080, 78.65620], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let roverMarker = L.marker([17.42080, 78.65620]).addTo(map).bindPopup("Rover Base");
        let detectionMarkers = [];

        // Set custom start point on map click
        map.on('click', function(e) {
            fetch('/api/set_start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lat: e.latlng.lat, lng: e.latlng.lng })
            }).then(res => res.json()).then(data => {
                if(data.status === 'success') {
                    roverMarker.setLatLng([data.lat, data.lng]);
                }
            });
        });

        // Set Target Distance (1 to 10 km)
        function setTargetDistance(val) {
            let targetVal = parseFloat(val);
            if (isNaN(targetVal) || targetVal < 1.0) targetVal = 1.0;
            if (targetVal > 10.0) targetVal = 10.0;

            fetch('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ target_km: targetVal })
            });
        }

        function sendCommand(cmd) {
            fetch('/api/control', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: cmd })
            });
        }

        function clearMap() {
            fetch('/api/clear_map', { method: 'POST' });
        }

        // Telemetry Polling Loop (Every 1 second)
        setInterval(() => {
            fetch('/api/telemetry')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('statusBadge').innerText = "STATUS: " + data.rover_status;
                    document.getElementById('distVal').innerText = data.distance_traveled_km;
                    document.getElementById('targetVal').innerText = data.target_km;
                    document.getElementById('batteryVal').innerText = data.battery_pct;
                    document.getElementById('materialVal').innerText = data.material_level_pct;
                    document.getElementById('potholeVal').innerText = data.total_potholes;
                    document.getElementById('matKgVal').innerText = data.total_material_kg;
                    document.getElementById('warningMsg').innerText = data.warning_msg;

                    // Update Rover position
                    roverMarker.setLatLng([data.current_lat, data.current_lng]);

                    // Render detections
                    if(data.detections.length === 0) {
                        detectionMarkers.forEach(m => map.removeLayer(m));
                        detectionMarkers = [];
                    } else if(data.detections.length > detectionMarkers.length) {
                        let newDet = data.detections[data.detections.length - 1];
                        let marker = L.circleMarker([newDet.lat, newDet.lng], { color: 'red', radius: 8 }).addTo(map);
                        marker.bindPopup(`Pothole ${newDet.id}: ${newDet.mat} kg filled`);
                        detectionMarkers.push(marker);
                    }
                });
        }, 1000);
    </script>
</body>
</html>
