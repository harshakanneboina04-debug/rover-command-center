<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rover GIS Command Center</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background-color: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 360px; padding: 15px; display: flex; flex-direction: column; gap: 12px; background: #1e293b; z-index: 1000; overflow-y: auto; }
        #map { flex-grow: 1; height: 100%; }
        .card { background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; }
        
        .cam-wrapper {
            position: relative;
            width: 100%;
            height: 180px;
            background: #000;
            border-radius: 6px;
            border: 1px solid #475569;
            overflow: hidden;
        }

        #webcam-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0;
            transform: scale(1.1);
            transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
        }

        #webcam-feed.active {
            opacity: 1;
            transform: scale(1);
        }

        .cam-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.85);
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1px;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .cam-overlay.hidden {
            opacity: 0;
        }

        .btn-group { display: flex; gap: 8px; margin-top: 10px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; }
        .btn-start { background: #22c55e; }
        .btn-pause { background: #eab308; }
        .btn-stop { background: #ef4444; }
        .stat { font-size: 1.1rem; font-weight: bold; color: #38bdf8; margin-top: 4px; }
        .warning-box { background: #ef4444; color: white; padding: 8px; border-radius: 4px; font-weight: bold; text-align: center; display: none; margin-top: 8px; }
    </style>
</head>
<body>

<div id="sidebar">
    <h3 style="margin:0 0 5px 0;">ROVER GIS LIVE TRACKING</h3>
    
    <div class="card">
        <div class="cam-wrapper">
            <video id="webcam-feed" autoplay playsinline muted></video>
            <div id="cam-status" class="cam-overlay">📷 CAMERA OFFLINE</div>
        </div>
        <div id="warning-alert" class="warning-box">⚠️ DETOUR: AVOIDING POTHOLE</div>
    </div>

    <div class="card">
        <label style="font-size: 0.85rem; font-weight: bold;">SET TARGET RANGE</label>
        <select id="target-km" onchange="updateConfig()" style="width: 100%; padding: 8px; margin-top: 5px; background: #1e293b; color: white; border: 1px solid #475569; border-radius: 4px;">
            <option value="0.05">0.05 km (50m - Quick Demo)</option>
            <option value="0.5">0.5 km</option>
            <option value="1.0">1.0 km</option>
            <option value="5.0">5.0 km</option>
            <option value="10.0" selected>10.0 km</option>
        </select>
        <div class="btn-group">
            <button class="btn-start" onclick="sendControl('START')">▶ START</button>
            <button class="btn-pause" onclick="sendControl('PAUSE')">⏸ PAUSE</button>
            <button class="btn-stop" onclick="sendControl('STOP')">⏹ ABORT & RETURN</button>
        </div>
    </div>

    <div class="card">
        <div style="font-size: 0.9rem;">STATUS: <span id="rover-status" class="stat">READY</span></div>
        <div style="margin-top: 8px; font-size: 0.9rem;">DISTANCE COVERED: <br><span id="distance-km" class="stat">0 / 10.0 km</span></div>
        <div style="margin-top: 8px; font-size: 0.9rem;">NO. OF HOLES: <br><span id="potholes-count" class="stat">0</span></div>
        <div style="margin-top: 8px; font-size: 0.9rem;">MATERIAL USED: <br><span id="material-kg" class="stat">0 kg</span></div>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([17.4210, 78.6575], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    const roverIcon = L.divIcon({
        className: 'custom-rover',
        html: '<div style="background:#00f0ff; width:18px; height:18px; border-radius:50%; border:3px solid white; box-shadow:0 0 10px #00f0ff;"></div>',
        iconSize: [20, 20]
    });

    let roverMarker = L.marker([17.4210, 78.6575], {icon: roverIcon}).addTo(map);
    let potholeMarkers = [];

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            document.getElementById('webcam-feed').srcObject = stream;
        } catch (err) {
            console.error("Camera access error:", err);
        }
    }
    initCamera();

    function setCameraState(active) {
        const videoElem = document.getElementById('webcam-feed');
        const overlay = document.getElementById('cam-status');
        
        if (active) {
            videoElem.classList.add('active');
            overlay.classList.add('hidden');
        } else {
            videoElem.classList.remove('active');
            overlay.classList.remove('hidden');
        }
    }

    function sendControl(cmd) {
        fetch('/api/control', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({command: cmd})
        });
    }

    function updateConfig() {
        const val = document.getElementById('target-km').value;
        fetch('/api/config', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({target_km: val})
        });
    }

    setInterval(() => {
        fetch('/api/telemetry')
            .then(res => res.json())
            .then(data => {
                document.getElementById('rover-status').innerText = data.rover_status;
                document.getElementById('distance-km').innerText = `${data.distance_traveled_km} / ${data.target_km} km`;
                document.getElementById('potholes-count').innerText = data.total_potholes;
                document.getElementById('material-kg').innerText = `${data.total_material_kg} kg`;

                setCameraState(data.camera_active);

                const warningBox = document.getElementById('warning-alert');
                if (data.avoiding_obstacle) {
                    warningBox.style.display = 'block';
                } else {
                    warningBox.style.display = 'none';
                }

                const pos = [data.current_lat, data.current_lng];
                roverMarker.setLatLng(pos);
                map.panTo(pos);

                if (data.detections.length === 0 && potholeMarkers.length > 0) {
                    potholeMarkers.forEach(m => map.removeLayer(m));
                    potholeMarkers = [];
                }

                if (data.detections.length > potholeMarkers.length) {
                    data.detections.slice(potholeMarkers.length).forEach(det => {
                        const m = L.circleMarker([det.lat, det.lng], {
                            color: '#22c55e', radius: 8, fillOpacity: 0.8
                        }).addTo(map);
                        potholeMarkers.push(m);
                    });
                }
            });
    }, 1000);
</script>

</body>
</html>
