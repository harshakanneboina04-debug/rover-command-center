<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Rover GIS Command Center</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; background-color: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; height: 100vh; }
        #sidebar { width: 380px; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 15px; background: #1e293b; }
        #map { flex-grow: 1; height: 100%; }
        .card { background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; }
        .video-box { width: 100%; height: 200px; background: #000; border-radius: 6px; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .video-box img { width: 100%; height: 100%; object-fit: cover; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; }
        .btn-start { background: #22c55e; }
        .btn-pause { background: #eab308; }
        .btn-stop { background: #ef4444; }
        .stat { font-size: 1.2rem; font-weight: bold; color: #38bdf8; margin-top: 5px; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Rover Command Center</h2>
    
    <div class="card">
        <div class="video-box">
            <img id="camera-stream" src="/video_feed" alt="Connecting to Camera Stream...">
        </div>
    </div>

    <div class="card">
        <label>Patrol Range Target:</label>
        <select id="target-km" onchange="updateConfig()" style="width: 100%; padding: 8px; margin-top: 5px;">
            <option value="0.05">0.05 KM (Quick Demo)</option>
            <option value="0.5">0.5 KM</option>
            <option value="1.0">1.0 KM</option>
            <option value="5.0">5.0 KM</option>
        </select>
        <div class="btn-group">
            <button class="btn-start" onclick="sendControl('START')">▶ START</button>
            <button class="btn-pause" onclick="sendControl('PAUSE')">⏸ PAUSE</button>
            <button class="btn-stop" onclick="sendControl('STOP')">⏹ STOP</button>
        </div>
    </div>

    <div class="card">
        <div>Status: <span id="rover-status" class="stat">READY</span></div>
        <div style="margin-top: 8px;">Distance Traveled: <span id="distance-km" class="stat">0.0 KM</span></div>
        <div style="margin-top: 8px;">Potholes Repaired: <span id="potholes-count" class="stat">0</span></div>
        <div style="margin-top: 8px;">Material Used: <span id="material-kg" class="stat">0.0 KG</span></div>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([17.3850, 78.4867], 18);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    const roverIcon = L.divIcon({
        className: 'custom-rover',
        html: '<div style="background:#00f0ff; width:16px; height:16px; border-radius:50%; border:3px solid white; box-shadow:0 0 10px #00f0ff;"></div>',
        iconSize: [20, 20]
    });

    let roverMarker = L.marker([17.3850, 78.4867], {icon: roverIcon}).addTo(map);
    let potholeMarkers = [];

    function sendControl(cmd) {
        fetch('/api/control', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({command: cmd})
        });
    }

    function updateConfig() {
        const val = document.getElementById('target-km').value;
        fetch('/api/config', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({target_km: val})
        });
    }

    // Auto-refresh camera stream if connection resets
    const imgEl = document.getElementById('camera-stream');
    imgEl.onerror = () => {
        setTimeout(() => { imgEl.src = "/video_feed?" + new Date().getTime(); }, 2000);
    };

    // Main Telemetry & Position Loop (Polls every 800ms)
    setInterval(() => {
        fetch('/api/telemetry')
            .then(res => res.json())
            .then(data => {
                document.getElementById('rover-status').innerText = data.rover_status;
                document.getElementById('distance-km').innerText = data.distance_traveled_km + ' KM';
                document.getElementById('potholes-count').innerText = data.total_potholes;
                document.getElementById('material-kg').innerText = data.total_material_kg + ' KG';

                const newLatLng = [data.current_lat, data.current_lng];
                roverMarker.setLatLng(newLatLng);
                map.panTo(newLatLng);

                // Clear old markers if mission resets
                if (data.detections.length === 0 && potholeMarkers.length > 0) {
                    potholeMarkers.forEach(m => map.removeLayer(m));
                    potholeMarkers = [];
                }

                // Plot potholes
                if (data.detections.length > potholeMarkers.length) {
                    data.detections.slice(potholeMarkers.length).forEach(det => {
                        const m = L.circleMarker([det.lat, det.lng], {
                            color: '#22c55e',
                            radius: 8,
                            fillOpacity: 0.8
                        }).addTo(map).bindPopup(`Pothole Repaired: ${det.cement_used_kg} kg material`);
                        potholeMarkers.push(m);
                    });
                }
            });
    }, 800);
</script>

</body>
</html>
